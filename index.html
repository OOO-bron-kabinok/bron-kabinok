<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронь Кабинки — IT.TEAM / IT.МОСКВА</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <div class="brand">
            <div class="brand-badge">IT.TEAM</div>
            <div class="brand-info">
                <h1>Бронь Кабинки</h1>
                <p>Колледж IT.МОСКВА</p>
            </div>
        </div>

        <nav class="nav-tabs">
            <button class="nav-btn active" id="nav-map" onclick="switchView('map')">
                План этажа
            </button>
            <button class="nav-btn" id="nav-bookings" onclick="switchView('bookings')">
                Мои брони <span class="counter-badge hidden" id="bookings-counter">0</span>
            </button>   
        </nav>
    </div>
</header>

    <section id="view-map">
        <div class="controls-bar">
            <div class="controls-left">
                <div class="floor-pills">
                    <button class="floor-pill active" onclick="changeFloor(1, this)">1 этаж</button>
                    <button class="floor-pill" onclick="changeFloor(2, this)">2 этаж</button>
                    <button class="floor-pill" onclick="changeFloor(3, this)">3 этаж</button>
                </div>
                <input type="date" id="booking-date" class="date-picker" onchange="renderFloor()">
            </div>

            <div class="legend">
                <div class="legend-item"><span class="status-dot free"></span><span>Свободен сейчас</span></div>
                <div class="legend-item"><span class="status-dot busy"></span><span>Занят (идет пара)</span></div>
                <div class="legend-item"><span class="status-dot booked"></span><span>Забронирован</span></div>
            </div>
        </div>

        <div class="floor-map">
            <div class="rooms-grid" id="rooms-north"></div>
            <div class="corridor">
                <span>← Лестница / Лифт</span>
                <span>Главный коридор • IT.МОСКВА</span>
                <span>Рекреация →</span>
            </div>
            <div class="rooms-grid" id="rooms-south"></div>
        </div>
    </section>

    <section id="view-bookings" class="hidden">
        <div class="section-header">
            <h2>Мои активные брони</h2>
            <button class="btn-secondary" onclick="simulatePush()">Проверить Push-напоминание</button>
        </div>
        <div class="bookings-grid" id="bookings-list"></div>
    </section>
</main>

<div class="modal-backdrop" id="modal-backdrop" onclick="handleBackdropClick(event)">
    <div class="modal-window">
        <div class="modal-header">
            <div>
                <h3 id="modal-title">Кабинка</h3>
                <p id="modal-subtitle">Описание</p>
            </div>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>

        <label class="field-label">Расписание на выбранную дату (выберите свободное окно):</label>
        <div class="slots-list" id="modal-slots"></div>

        <label class="field-label" for="purpose-input">Цель бронирования:</label>
        <input type="text" id="purpose-input" class="text-input" placeholder="Например: собрание старост или подготовка к экзамену">
        <div class="error-msg" id="modal-error"></div>

        <button class="btn-primary" onclick="submitBooking()">Забронировать кабинку</button>
    </div>
</div>

<div class="toast" id="toast">
    <div class="toast-icon">🔔</div>
    <div>
        <div class="toast-title" id="toast-title">Уведомление</div>
        <div class="toast-body" id="toast-body">Текст уведомления</div>
    </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
