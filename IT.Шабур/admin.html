<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — Электронный студенческий</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">IT.Шабур · Админ</div>
      <nav class="nav">
        <a href="admin.html" class="active">Студенты</a>
        <a href="#" onclick="logout(); return false;">Выйти</a>
      </nav>
    </header>

    <div class="card">
      <h2>Студенты</h2>
      <table id="studentsTable">
        <thead>
          <tr>
            <th>ФИО</th>
            <th>Логин</th>
            <th>Группа</th>
            <th>Шабурята</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card">
      <h3>Добавить студента</h3>
      <div class="input-group">
        <label>Логин</label>
        <input type="text" id="newLogin" placeholder="ivanov">
      </div>
      <div class="input-group">
        <label>Пароль</label>
        <input type="text" id="newPassword" placeholder="пароль">
      </div>
      <div class="input-group">
        <label>ФИО</label>
        <input type="text" id="newName" placeholder="Иванов Иван">
      </div>
      <div class="input-group">
        <label>Группа</label>
        <input type="text" id="newGroup" placeholder="2ИП-7-25" required>
      </div>
      <div class="input-group">
        <label>Специальность</label>
        <input type="text" id="newSpecialty" placeholder="09.02.07 Информационные системы и программирование" required>
      </div>
      <button class="btn" onclick="addStudent()">Добавить</button>
    </div>
  </div>
  <script src="app.js"></script>
  <script>loadAdminPage();</script>
</body>
</html>
